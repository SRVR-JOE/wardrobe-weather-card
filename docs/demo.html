<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wardrobe Weather Card demo</title><style>body{font-family:Arial;background:#191720;color:#eee;margin:24px}main{max-width:480px;margin:auto}button{padding:12px;margin:4px}header{margin:0 auto 20px;max-width:480px}ha-icon{display:none}</style><header><h1>Wardrobe Weather Card</h1><p>Demo using synthetic weather. No Home Assistant connection.</p><button onclick="document.querySelector('main').style.maxWidth='320px'">320px phone</button><button onclick="document.querySelector('main').style.maxWidth='480px'">480px card</button></header><main></main><script src="../dist/wardrobe-weather-card.js"></script><script>
const card=document.createElement('wardrobe-weather-card');card.setConfig({entity:'weather.demo',title:'What to wear',show_designer:false});document.querySelector('main').append(card);card.hass={config:{time_zone:'UTC'},states:{'weather.demo':{state:'partlycloudy',attributes:{temperature:63,temperature_unit:'°F',wind_speed:6,wind_speed_unit:'mph'},last_updated:new Date().toISOString()}},connection:{subscribeMessage:async callback=>{callback({forecast:[63,70,58,49,40].map((temp,i)=>{const d=new Date();d.setUTCDate(d.getUTCDate()+i);d.setUTCHours(12,0,0,0);return {datetime:d.toISOString(),temperature:temp,templow:temp-13,condition:i===2?'rainy':'partlycloudy',wind_speed:5};})});return ()=>{};}}};
</script></html>
